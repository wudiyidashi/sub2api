syntax = "proto3";
package accountdriver.poc.v1;
option go_package = "example.com/sub2api/account-driver-poc/pocv1";

// 隔离 PoC 合同，尚未注册到 PluginManager，也不是 transport v1
service Driver {
  rpc Execute(stream Command) returns (stream Event);
}
service HostCallbacks {
  rpc ResolveIdentity(Start) returns (Identity);
}
message Start {
  string attempt_id = 1;
  int64 account_id = 2;
  int64 credential_revision = 3;
  int64 binding_revision = 4;
  string base_url = 5;
  bytes body = 6;
}
message Identity {
  string authorization = 1;
  string upstream_account_id = 2;
}
message Command {
  oneof frame {
    Start start = 1;
    bool permit_send = 2;
    bool cancel = 3;
  }
}
message Event {
  string kind = 1;
  string send_state = 2;
  bytes body = 3;
  uint32 status = 4;
  string error_code = 5;
  // 用量是观测，不写费用账本
  uint64 input_tokens = 6;
  uint64 output_tokens = 7;
}
