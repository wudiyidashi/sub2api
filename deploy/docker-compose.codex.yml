# Optional Codex bridge overlay.
#
# Start from deploy/ with:
#   docker compose -f docker-compose.yml -f docker-compose.codex.yml up -d
#
# The bridge owns Codex OAuth accounts and its own PostgreSQL/Redis. Sub2API
# talks to it as an internal OpenAI-compatible upstream and keeps ownership of
# downstream users, API keys, billing, and subscriptions.

services:
  sub2api:
    depends_on:
      codex-proxy-rs:
        condition: service_healthy

  codex-proxy-postgres:
    image: postgres:18-bookworm
    container_name: sub2api-codex-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: codex_proxy
      POSTGRES_USER: codex_proxy
      POSTGRES_PASSWORD: ${CPR_DATABASE_PASSWORD:?CPR_DATABASE_PASSWORD is required}
    volumes:
      - codex_proxy_postgres_data:/var/lib/postgresql/data
    networks:
      - sub2api-network
    healthcheck:
      test: [CMD-SHELL, pg_isready -U codex_proxy -d codex_proxy]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  codex-proxy-redis:
    image: redis:8-alpine
    container_name: sub2api-codex-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${CPR_REDIS_PASSWORD:?CPR_REDIS_PASSWORD is required}
    volumes:
      - codex_proxy_redis_data:/data
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${CPR_REDIS_PASSWORD:?CPR_REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  codex-proxy-rs:
    image: ${CPR_IMAGE:-ghcr.io/zyycn/codex-proxy-rs:v3.13.0}
    container_name: sub2api-codex-proxy
    restart: unless-stopped
    init: true
    depends_on:
      codex-proxy-postgres:
        condition: service_healthy
      codex-proxy-redis:
        condition: service_healthy
    networks:
      - sub2api-network
    ports:
      - '127.0.0.1:${CPR_PORT:-18080}:8080'
    volumes:
      - ./codex-proxy/config.yaml:/app/deploy/config.yaml:ro
      - codex_proxy_runtime_data:/app/.runtime/data
      - codex_proxy_runtime_logs:/app/.runtime/logs
    environment:
      HOME: /app
      CPR_SERVER_HOST: 0.0.0.0
      CPR_SERVER_PORT: '8080'
      CPR_DATABASE_URL: postgres://codex_proxy@codex-proxy-postgres:5432/codex_proxy
      CPR_DATABASE_PASSWORD: ${CPR_DATABASE_PASSWORD:?CPR_DATABASE_PASSWORD is required}
      CPR_REDIS_URL: redis://codex-proxy-redis:6379/
      CPR_REDIS_PASSWORD: ${CPR_REDIS_PASSWORD:?CPR_REDIS_PASSWORD is required}
      CPR_DEPLOYMENT_MODE: docker
      CPR_UPDATE_REPOSITORY: zyycn/codex-proxy-rs
      CPR_GITHUB_API_BASE: https://api.github.com/repos
      CPR_WEB_DIST_DIR: /app/web/dist
      CPR_ENABLE_SELF_RESTART: 'true'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  codex_proxy_postgres_data:
  codex_proxy_redis_data:
  codex_proxy_runtime_data:
  codex_proxy_runtime_logs:
