syntax = "proto3";
package sub2api.accountdriver.v1;
option go_package = "github.com/Wei-Shaw/sub2api/pkg/accountdriverapi/v1;accountdriverv1";

// 与既有 go-plugin transport v1 独立协商的受管账号执行合同
service AccountDriver {
  rpc Execute(stream ExecuteCommand) returns (stream ExecuteEvent);
  rpc OpenWebSocket(stream WebSocketCommand) returns (stream WebSocketEvent);
}
service HostCallbacks {
  rpc ResolveIdentity(IdentityRequest) returns (IdentityResponse);
}

enum SendState {
  SEND_STATE_UNSPECIFIED = 0;
  SEND_STATE_NOT_SENT = 1;
  SEND_STATE_AMBIGUOUS = 2;
  SEND_STATE_SENT = 3;
}
// 按列表保留未知字段、重复字段和非 UTF-8 值
message Header { string name = 1; bytes value = 2; }
message ExecuteStart {
  string request_id = 1;
  string attempt_id = 2;
  int64 account_id = 3;
  int64 credential_revision = 4;
  int64 binding_revision = 5;
  string method = 6;
  string url = 7;
  repeated Header headers = 8;
  bytes body = 9;
  string proxy_url = 10;
  int64 timeout_ms = 11;
  // 仅限制上游响应头建立，响应头交付后不影响 body 流
  int64 header_timeout_ms = 12;
}
message ExecuteCommand {
  oneof frame {
    ExecuteStart start = 1;
    // 宿主必须先冻结 ambiguous 再发送许可
    bool permit_send = 2;
    bool cancel = 3;
  }
}
message Ready {}
message StateChanged {}
message ResponseHead {
  uint32 status_code = 1;
  repeated Header headers = 2;
  string protocol = 3;
}
message BodyChunk { bytes data = 1; }
message ResponseEnd { uint64 bytes_received = 1; }
message AttemptFailure {
  string code = 1;
  string message = 2;
  uint32 upstream_status = 3;
  bytes raw_body = 4;
}
message ExecuteEvent {
  SendState send_state = 1;
  oneof frame {
    Ready ready = 2;
    StateChanged state_changed = 3;
    ResponseHead head = 4;
    BodyChunk body = 5;
    ResponseEnd end = 6;
    AttemptFailure failure = 7;
  }
}
message IdentityRequest {
  string request_id = 1;
  string attempt_id = 2;
  int64 account_id = 3;
  int64 credential_revision = 4;
  int64 binding_revision = 5;
  string session_id = 6;
  string key_scope_hash = 7;
  // SHA256(完整 Authorization header bytes)，仅用于身份绑定，无原始 Token
  string credential_fingerprint = 8;
}
message IdentityResponse {
  bool authorized = 1;
  // 来自宿主已准备请求的 AT 和账号身份头，无 refresh token
  repeated Header protected_headers = 2;
  string proxy_url = 3;
}

// 一次 RPC 对应一条指定身份的连接；连接池与 previous_response_id 归宿主所有
message WebSocketStart {
  string request_id = 1;
  string session_id = 2;
  int64 account_id = 3;
  int64 credential_revision = 4;
  int64 binding_revision = 5;
  string key_scope_hash = 6;
  string credential_fingerprint = 7;
  string url = 8;
  repeated Header headers = 9;
  string proxy_url = 10;
  int64 handshake_timeout_ms = 11;
}
enum WebSocketMessageKind {
  WEB_SOCKET_MESSAGE_KIND_UNSPECIFIED = 0;
  WEB_SOCKET_MESSAGE_KIND_TEXT = 1;
  WEB_SOCKET_MESSAGE_KIND_BINARY = 2;
  WEB_SOCKET_MESSAGE_KIND_CLOSE = 8;
  WEB_SOCKET_MESSAGE_KIND_PING = 9;
  WEB_SOCKET_MESSAGE_KIND_PONG = 10;
}
message WebSocketMessage {
  uint64 sequence = 1;
  WebSocketMessageKind kind = 2;
  bytes data = 3;
}
message WebSocketClose {
  uint32 code = 1;
  string reason = 2;
}
message WebSocketCommand {
  oneof frame {
    WebSocketStart start = 1;
    bool permit_connect = 2;
    // 文本/二进制最多16MiB，控制帧最多125字节；原始bytes不做JSON改写
    WebSocketMessage message = 3;
    WebSocketClose close = 4;
    bool cancel = 5;
  }
}
message WebSocketWriteAck {
  uint64 sequence = 1;
}
message WebSocketClosed {
  uint32 code = 1;
  string reason = 2;
  bool clean = 3;
}
message WebSocketEvent {
  // 此状态只描述业务payload，成功握手仍为not_sent
  SendState send_state = 1;
  oneof frame {
    Ready ready = 2;
    ResponseHead handshake = 3;
    WebSocketMessage message = 4;
    WebSocketWriteAck write_ack = 5;
    WebSocketClosed closed = 6;
    AttemptFailure failure = 7;
  }
}
